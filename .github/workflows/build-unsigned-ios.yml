name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    # React Native used by Expo SDK 57 needs Xcode 16.1 or newer.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo Modules JSI needs the Swift 6.2 toolchain. Xcode 26.0 is the
      # first compatible runner image and avoids the stricter 26.3 Clang
      # diagnostics that affect the current React Native headers.
      - name: Select compatible Xcode
        shell: bash
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.0.app/Contents/Developer" >> "$GITHUB_ENV"
          /Applications/Xcode_26.0.app/Contents/Developer/usr/bin/xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      # expo-modules-jsi 57.1.0 predates the Swift 6.2 diagnostics bundled
      # with this runner. These are source-compatible corrections, applied
      # only to the clean CI installation.
      - name: Apply Swift 6.2 compatibility patch
        shell: bash
        run: |
          JSI="node_modules/expo-modules-jsi/apple"
          sed -i '' '/NonisolatedNonsendingByDefault/d; /InferIsolatedConformances/d' "$JSI/Package.swift"
          perl -0pi -e 's/\.unsafeFlags\(\[/\.unsafeFlags([\n          "-strict-concurrency=minimal",/' "$JSI/Package.swift"
          find "$JSI/Sources" -name '*.swift' -exec sed -i '' 's/weak let/weak var/g' {} +
          perl -0pi -e 's/(_ arguments: consuming JavaScriptValuesBuffer),\n(\s*\) async throws)/$1\n$2/' "$JSI/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift"
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' "$JSI/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          sed -i '' 's/class JavaScriptPropNameID: JavaScriptType/class JavaScriptPropNameID: \@unchecked Sendable, JavaScriptType/' "$JSI/Sources/ExpoModulesJSI/Runtime/JavaScriptPropNameID.swift"
          sed -i '' 's/JavaScriptError: Error, Sendable/JavaScriptError: Error, \@unchecked Sendable/' "$JSI/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptError.swift"
          sed -i '' 's/JavaScriptValue: JavaScriptType, Equatable, Escapable/JavaScriptValue: \@unchecked Sendable, JavaScriptType, Equatable, Escapable/' "$JSI/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptValue.swift"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile without Apple signing
        shell: bash
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          (cd artifacts && zip -qry ../heo-dat-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: heo-dat-unsigned-ipa
          path: heo-dat-unsigned.ipa
          retention-days: 14
